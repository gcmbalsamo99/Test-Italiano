<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test di Italiano 🇮🇹 - Liebesreise Edition ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🇮🇹 Test di Italiano 🇮🇹</h1>
                <p class="subtitle">Lerne Italienisch für deine nächste Liebesreise! ❤️</p>
                <div class="emoji-dance">🍝 🎭 🎵 🌟 💬</div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">Domanda 1 di 8</p>
        </div>

        <main id="quiz-container" class="quiz-container">
            <!-- Domande generate da JavaScript -->
        </main>

        <div class="button-group">
            <button id="prevBtn" class="btn btn-secondary" style="display:none;">← Indietro</button>
            <button id="nextBtn" class="btn btn-primary">Avanti →</button>
        </div>
    </div>

    <div id="results-modal" class="results-modal hidden">
        <div class="results-content">
            <div class="results-header">🎉 Complimenti! 🎉</div>
            <div id="resultDetails" class="result-details"></div>
            <button class="btn btn-primary" onclick="location.reload()">Ricomincia il Test 🔄</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
