<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test di Italiano - Livello Base 🇮🇹</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🇮🇹 Test di Italiano - Livello Base 🇮🇹</h1>
            <p class="subtitle">Lerne Italienisch für deine nächste Liebesreise! ❤️</p>
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <main id="quiz-container">
            <!-- Le domande verranno generate da JavaScript -->
        </main>

        <div class="button-group">
            <button id="prevBtn" class="btn btn-secondary" style="display:none;">← Indietro</button>
            <button id="nextBtn" class="btn btn-primary">Avanti →</button>
        </div>

        <div id="results" class="results-hidden">
            <div class="results-content">
                <h2>🎉 Complimenti! 🎉</h2>
                <div id="resultDetails"></div>
                <button class="btn btn-primary" onclick="location.reload()">Ricomincia il Test</button>
            </div>
        </div>
    </div>

    <!-- Tooltip per le traduzioni -->
    <div id="tooltip" class="tooltip"></div>

    <script src="script.js"></script>
</body>
</html>
